  <title>Meu Linktree Neon</title>

  <style>
    {
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:
      radial-gradient(circle at top, #0f2a55 0%, #050505 55%);
      overflow:hidden;
      color:white;
    }

    .container{
      width:90%;
      max-width:420px;
      text-align:center;
    }

    .profile{
      margin-bottom:35px;
    }

    .profile img{
      width:120px;
      height:120px;
      border-radius:50%;
      object-fit:cover;
      border:3px solid #00d9ff;
      box-shadow:0 0 25px #00d9ff;
      margin-bottom:15px;
    }

    .profile h1{
      font-size:30px;
      letter-spacing:2px;
      text-shadow:0 0 15px #00d9ff;
    }

    .profile p{
      margin-top:8px;
      color:#9ecfff;
    }

    .links{
      display:flex;
      flex-direction:column;
      gap:22px;
    }

    .link{
      position:relative;
      padding:18px;
      border-radius:18px;
      text-decoration:none;
      color:white;
      font-size:18px;
      font-weight:bold;
      background:#000;
      transition:0.25s;
      overflow:hidden;
    }

    .link:hover{
      transform:scale(1.05);
    }

    / PRIMEIRA BARRA */
    .red{
      border:2px solid #ff0000;
      box-shadow:
      0 0 10px #ff0000,
      0 0 25px #ff0000;
    }

    .red:hover{
      box-shadow:
      0 0 15px #ff0000,
      0 0 40px #ff0000;
    }
/* SEGUNDA BARRA /
    .aqua-pink{
      border:2px solid transparent;
      background:
      linear-gradient(#000,#000) padding-box,
      linear-gradient(90deg,#00ffff,#ff00ff,#00ffff) border-box;
      box-shadow:
      0 0 15px #00ffff,
      0 0 25px #ff00ff;
    }

    .aqua-pink:hover{
      box-shadow:
      0 0 20px #00ffff,
      0 0 40px #ff00ff;
    }

    / TERCEIRA BARRA /
    .cyan{
      border:2px solid #00e5ff;
      box-shadow:
      0 0 12px #00e5ff,
      0 0 30px #00e5ff;
    }

    .cyan:hover{
      box-shadow:
      0 0 18px #00e5ff,
      0 0 45px #00e5ff;
    }

    / QUARTA BARRA */
    .blurple{
      border:2px solid #5865F2;
      box-shadow:
      0 0 12px #5865F2,
      0 0 30px #5865F2;
    }

    .blurple:hover{
      box-shadow:
      0 0 18px #5865F2,
      0 0 45px #5865F2;
    }

    .footer{
      margin-top:30px;
      color:#7aaeff;
      font-size:14px;
    }

  </style>
